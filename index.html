<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="Lernen in kurzen Abschnitten – mit eingebautem Speed-Reader." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#212125" media="(prefers-color-scheme: dark)" />

    <!-- Als App vom Home-Bildschirm (iPhone/iPad) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Leenli" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <title>Leenli</title>

    <!-- Gewählte Darstellung sofort setzen, bevor die App geladen ist
         (Gegenstück: src/lib/appearance.ts) -->
    <script>
      try {
        var a = JSON.parse(localStorage.getItem('leenli-appearance') || 'null')
        var root = document.documentElement
        if (a && (a.theme === 'light' || a.theme === 'dark')) {
          root.setAttribute('data-theme', a.theme)
          var bar = a.theme === "dark" ? "#212125" : "#f7f3ea"
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute('content', bar)
          })
        }
        if (a && typeof a.fontScale === 'number') root.style.setProperty('--font-scale', String(a.fontScale))
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Leenli braucht JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
